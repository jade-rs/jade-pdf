[package]
name = "jade-pdf-wasm-smoke"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
jade-pdf-diff = { path = "../../crates/jade-pdf-diff" }
pdfium-render = { version = "=0.8.37", default-features = false, features = ["thread_safe", "pdfium_latest", "image_latest"] }
wasm-bindgen = "=0.2.129"
serde_json = "1"
js-sys = "=0.3.106"
