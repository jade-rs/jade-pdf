[package]
name = "jade-pdf2docx-parser"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-jpeg = "0.4.21"
fax = "0.2.7"
moxcms = { version = "0.8.1", default-features = false, features = ["lut", "options"] }
hayro-jbig2 = { version = "0.3.0", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pdfium-render = { version = "0.8", default-features = false, features = ["thread_safe", "bindings", "pdfium_latest", "image_latest"] }
pdfium-auto = "0.3"

[dev-dependencies]
proptest = "1"
