[package]
name = "jade-pdf2docx-ocr"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[example]]
name = "ocr_benchmark"
required-features = ["onnx"]

[features]
default = []
ndlocr-lite = ["dep:ndlocr-lite-rs"]
onnx = ["ndlocr-lite", "ndlocr-lite-rs/onnx"]
table-ppstructure = ["dep:serde", "dep:serde_json"]

[dependencies]
jade-pdf2docx-ocr-correction = { path = "../jade-pdf2docx-ocr-correction" }
ndlocr-lite-rs = { git = "https://github.com/bokuweb/ndlocr-lite-rs", tag = "0.0.14", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"
