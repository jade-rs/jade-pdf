[package]
name = "jade-pdf-diff"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Structure-aware PDF diff library with page and text block alignment"

[lib]
name = "pdf_diff"

[[bin]]
name = "pdf-diff"
path = "src/main.rs"

[dependencies]
anyhow = "1"
diff-align = { package = "jade-diff-align", git = "https://github.com/jade-rs/jade-core", tag = "0.1.0" }
diff_support = { package = "jade-diff-support", git = "https://github.com/jade-rs/jade-core", tag = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"

# ネイティブでは Pdfium の実体を pdfium-auto が用意する。
# WASM では Pdfium を JS 側で読み込んだ Emscripten モジュールにつなぐので要らない。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pdfium-auto = "0.3"
pdfium-render = { version = "0.8", default-features = false, features = ["thread_safe", "bindings", "pdfium_latest", "image_latest"] }

# `bindings` はビルド時に bindgen を回すので wasm32 では通らない (time.h が
# 無い)。同梱の生成済みバインディングで足りる。
[target.'cfg(target_arch = "wasm32")'.dependencies]
pdfium-render = { version = "0.8", default-features = false, features = ["thread_safe", "pdfium_latest", "image_latest"] }

[features]
# Pdfium の実体を実行ファイルへ埋め込む。
#
# 既定は実行時ダウンロード。手元での開発とテストはそれで足りるうえ、ビルドが
# 速い。配布する実行ファイルではこちらを有効にする (`ellisii` は既定で付ける)。
# 署名した実行ファイルの外から未署名の DLL を落としてくることになると、
# 署名の意味が薄れるし、初回の PDF 表示に通信が要る。
bundled-pdfium = ["pdfium-auto/bundled"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
